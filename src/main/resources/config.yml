# ItemShops production config
config-version: 2
#
# Notes:
# - Shops inside a configured market region default to being searchable.
# - Shops outside market regions default to hidden from search, but owners can toggle search on in the edit menu.
# - Outside a market region, shops must respect the configured container spacing rule.
# - Double chests count as one container for spacing and shop-limit checks.

max-shops-per-player: 64

# Maximum number of shop signs that may be linked to one unified container.
max-shops-per-container: 2

# When true, all shops on the same container must belong to the same owner.
one-owner-per-container: true

market:
  # Regions are managed through /shopmarket.
  regions: []

  # Outside market regions, another shop container may not exist within this many blocks
  # using a Chebyshev-style cube distance. A value of 1 means you need a one-block air gap.
  outside-spacing-radius: 1

allowed-containers:
  - CHEST
  - BARREL

sign:
  header: "[Shop]"
  instock-color: "&a"
  outstock-color: "&c"
  show-stock-on-click: true
  format-lines:
    - "{header}"
    - "&fOwner: &7{owner}"
    - "&aPay: &f{cost_amt}x {cost_name}"
    - "&eGet:  &f{sell_amt}x {sell_name}"

gui:
  create-title: "&2Create Item Shop"
  purchase-title: "&6Buy from Shop"
  search-title: "&6Shops for &e{query} &6({mode})"
  edit-title: "&bEdit Shop"
  trust-title: "&bTrusted Players"
  bulktrust-title: "&bTrust {player} (click to toggle)"
  glass-name: "&7 "
  confirm-name: "&aConfirm"
  cancel-name: "&cCancel"
  save-name: "&aSave Changes"
  delete-name: "&cDelete Shop"
  buymax-name: "&eBuy Max"

hoppers:
  # Default values used when a shop is first created or when old data is missing hopper flags.
  default-allow-in: false
  default-allow-out: false

sign-update:
  # Max number of containers/sign groups to refresh in one scheduled pass.
  batch-per-run: 200

  # Delay between refresh passes. 1 tick keeps stock signs responsive without forcing
  # all sign work into the exact same event that changed the inventory.
  run-delay-ticks: 1

safety:
  # Retained for compatibility with existing configs and future checks.
  match-exact-meta: true
  deny-non-owner-break: true
  require-attachment: true
  block-hoppers: false

  # Legacy fallback path. The runtime prefers the top-level sign-update section above.
  sign-update:
    max-per-tick: 200
    period-ticks: 1

storage:
  # sqlite is the intended production target. Existing shops.yml and vault.yml
  # are imported automatically the first time sqlite storage starts empty.
  type: sqlite
  sqlite:
    file: "itemshops.db"

  # Legacy YAML shop file. Kept as the automatic import source for existing servers.
  file: "shops.yml"

analytics:
  # Records lightweight ItemShops activity history for admin review and optional integrations.
  enabled: true
  history-file: "analytics.yml"
  retention-days: 30
  recent-table-limit: 10
  plan:
    enabled: true

shop-audit:
  enabled: true
  interval-minutes: 10
  max-shops-per-tick: 5
  repair-enabled: true
  report-only: false
  debug-log-repairs: false

debug:
  removals: true
  performance:
    enabled: false
    log-interval-seconds: 300
